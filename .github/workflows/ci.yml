name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# 依赖只有本仓内的 core/（见 core/VENDORED.md），不再跨仓 checkout，
# 因此不需要任何 PAT，fork 来的 PR 也能跑完整检查。

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 基础矩阵：Linux（计费倍率 ×1）+ Windows（×2）。
        os: [ubuntu-latest, windows-latest]
        # ── macOS 真机测试：默认**不跑**（2026-10-07 起）────────────────────────
        # 计费倍率 Linux 1× / Windows 2× / macOS **10×**。实测：macOS 每月只跑约 76
        # 分钟，却吃掉 760 计分 = 免费额度（2000 分）的 38% —— 全仓最大单项浪费。
        # 所以它从「每次 push 都跑」降级为「按需开启」。
        #
        # 要验 macOS 真机行为时，把 repo 变量 CI_MACOS 设为 true 即恢复：
        #   gh variable set CI_MACOS --body true --repo sji-xiaobenben/xbb-cli
        # 设回 false（或在 Actions 变量页删掉它）即回到默认的不跑。
        # 未设置该变量时走 `||` 分支 = 空数组 = 不产生 macos job（跳过的 job 不计费）。
        #
        # ⚠️ 边界（很重要）：本开关只关「macOS 上真机跑测试」这一件事。
        #   **darwin 产物照旧在 ubuntu 上交叉编译**并发往 CDN（见 release.yml 的 build
        #   矩阵），它不消耗任何 macOS 分钟 ⇒ Mac 用户的更新通道完全不受影响。
        include: ${{ fromJSON(vars.CI_MACOS == 'true' && '[{"os":"macos-latest"}]' || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --backend copyfile
      # 许可头闸：每个可执行源码文件都要自证许可（SPDX 表达式），新增文件忘加就拦住。
      # 没有这道闸，头会慢慢腐掉——而 OEM 客户做开源合规审查时是逐个文件看的。
      # 覆盖 .ts/.mjs/.js/.sh：前三个会随 exe 或插件一起落到用户机器上，.sh 是发版旁路，
      # 都是"被复制走之后仍带着出处"最有价值的那类文件。
      # 只跑 Linux 一次：内容检查与平台无关，两平台各跑一遍纯属白烧分钟数。
      - name: "许可闸：可执行源码都带 SPDX 头"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          missing=$(grep -rL "SPDX-License-Identifier" src core tools plugins \
            --include='*.ts' --include='*.mjs' --include='*.js' --include='*.sh' \
            --exclude-dir=node_modules || true)
          if [ -n "$missing" ]; then
            echo "::error::以下文件缺少 SPDX 许可头，请照抄 src/serve.ts 的前两行（脚本类放 shebang 之后）："
            printf '%s\n' "$missing"
            exit 1
          fi
          echo "✓ 全部源码文件均带 SPDX 头"
      - name: Typecheck
        run: bun run typecheck
      # 自更新身份闸：release.yml 的注入只在 RELEASE_ENABLED=true 时才跑，平时静默存在。
      # 而注入一旦失配（有人给常量加了类型标注、改了常量名、换了占位值形状），sed 会**静默**
      # 替换不上：产物只是失去自更新，客户端照样回报「已是最新」，全量用户永久停在旧版。
      # 等发版当天才发现太晚，所以每次 CI 都用与 release.yml 同形的 sed 演一遍判定。
      # 只跑 Linux 一次：纯字符串与类型判定，与平台无关。
      - name: "自更新身份闸：官方仓才检索更新，fork 与本地构建不检索"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # 用仓内相对目录而不是 mktemp：bun -e 的动态 import 走的是原生路径，
          # /tmp/... 在 Windows 上解析不到（本地复跑这道闸时会踩），相对路径两平台一致。
          tmp=".selfupdate-probe"
          rm -rf "$tmp" && mkdir -p "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          official_repo=$(sed -nE 's/^export const OFFICIAL_REPO(: string)? = "(.*)";/\2/p' src/build-meta.ts)
          if [ -z "$official_repo" ]; then
            echo "::error::从 src/build-meta.ts 读不到 OFFICIAL_REPO"
            exit 1
          fi
          probe() {
            local repo="$1" want="$2"
            cp src/build-meta.ts "$tmp/build-meta.ts"
            # 与 release.yml 注入步骤逐字同形
            sed -i "s#export const VERSION = \".*\";#export const VERSION = \"9.9.9\";#" "$tmp/build-meta.ts"
            sed -i "s#export const BUILD_TIME = \".*\";#export const BUILD_TIME = \"2026-01-01 00:00\";#" "$tmp/build-meta.ts"
            sed -i "s#export const BUILD_REPO = \".*\";#export const BUILD_REPO = \"$repo\";#" "$tmp/build-meta.ts"
            # 替换不上时 sed 会原样保留旧行，这里必须自己验，否则后面读到的是没注入的文件
            if ! grep -qF "export const BUILD_REPO = \"$repo\";" "$tmp/build-meta.ts"; then
              echo "::error::BUILD_REPO 注入失配（期望 $repo）—— release.yml 的 sed 与自己已不同步"
              exit 1
            fi
            got=$(bun -e "const m = await import('./$tmp/build-meta.ts'); console.log(m.IS_OFFICIAL_BUILD)" | tr -d '\r')
            if [ "$got" != "$want" ]; then
              echo "::error::BUILD_REPO=$repo 时 IS_OFFICIAL_BUILD 应为 $want，实际 $got"
              exit 1
            fi
            echo "✓ BUILD_REPO=$repo → official=$got"
          }
          probe "$official_repo" true
          probe "someone-else/xbb-cli" false
          probe "${official_repo}-fork" false   # 仓库名长得像官方也不行
          # 未注入的本地构建同样必须是非官方
          cp src/build-meta.ts "$tmp/build-meta.ts"
          got=$(bun -e "const m = await import('./$tmp/build-meta.ts'); console.log(m.IS_OFFICIAL_BUILD)" | tr -d '\r')
          if [ "$got" != "false" ]; then
            echo "::error::未注入的本地构建被判成官方（IS_OFFICIAL_BUILD=$got）—— 本地 exe 会去官网查更新"
            exit 1
          fi
          echo "✓ 未注入（本地直接构建）→ official=false"
      - name: Test
        run: bun run test:ci
      # dev 通、exe 挂 - 本项目最贵的一类失败（托盘就是这么在正式版里坏了 10 天没人发现）。
      # 只编一个 linux-x64 来验「资产真的嵌进产物」，零成本换来 PR 级防护。
      - name: "产物闸：托盘资产确实嵌进 exe"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bun run build:linux
          bun run tools/check-tray-embedded.ts dist/xbb-linux-x64 linux
