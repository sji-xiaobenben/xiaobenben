# ─────────────────────────────────────────────────────────────────────────────
# 存档流水线：把**已经发布到 CDN 的某个版本**挂成 GitHub Release。
#
# 与 release.yml 的分工（2026-11-08 拆开）：
#   release.yml  —— push master 触发，构建三平台产物并发到 CDN。这是发版主线，
#                   master 永远等于线上，不存在「几个版本堆着没发」的中间态。
#   archive.yml  —— 本文件。tag push 触发，只做归档，**不构建、不发 CDN**。
#
# 为什么必须拆开（tag 不能兼任发版触发器）：
#   · 漏打 tag 就等于追溯断链——那个版本从此没有名字，用户报 bug 无法回到那版代码。
#   · 更糟的是补打：tag 触发发版时，补一个历史 tag 会**重新发一次版**，所以根本不敢补。
#   拆开后 tag 退化成纯标签，想什么时候打、补几个、指向哪个历史 commit 都行，都不会
#   碰线上。代价只有一个：tag 名必须和 CDN 上实际发布的版本号对得上，对不上直接失败。
#
# 版本号怎么来：release.yml 读 package.json 的 version，所以**发版前就知道**这次是哪个号
# （package.json 里那一行就是版本号）。tag 名必须与之完全一致，否则本流水线会失败。
# tag 必须用 `git tag -s` 打：本流水线会验 SSH 签名，未签的 tag 直接失败（见「校验 tag 签名」
# 一步）。顺序上仍然建议发完再打 —— 先确认 CDN 上的 stable.json 已指向新版本，再签。
# ─────────────────────────────────────────────────────────────────────────────
name: Archive

on:
  push:
    # 收紧到 v + 数字：`v*` 会把 `version/0.4.47-261108` 这种分支风格的名字也匹配进来。
    tags: ["v[0-9]*"]
  # 补存档入口：给某个历史上发过、但当时忘了打 tag 的版本补一个 Release。
  workflow_dispatch:
    inputs:
      tag:
        description: "要归档的 tag（形如 v0.4.47，必须等于当时实际发布的版本号）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: 解析并校验 tag
        id: t
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then tag="$INPUT_TAG"; else tag="$REF_NAME"; fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 必须是 vX.Y.Z 形式，收到「$tag」"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "✓ 归档 $tag"

      # 验签需要 tag 对象本身（不只是它指向的 commit），所以必须 fetch-tags。
      # persist-credentials: false —— 后面的步骤不推送任何东西，别把 token 留在 .git/config。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # ── tag 签名闸 ────────────────────────────────────────────────────────
      # 为什么要有这道闸：v0.4.49 就是在没有闸的情况下漏签的一个版本。人对「顺手加个 -s」
      # 的记忆力不可靠，而漏签的后果不可逆 —— tag 一旦进了公开仓库并被镜像抓走，事后补签
      # 只能删了重打，GitHub Release 跟着抖一下。所以把「签了没有」变成流水线的准入条件。
      #
      # ⚠️ 这里有一个必踩的坑：`git tag -v` 对**未签名**的 annotated tag **不报错、退出码 0**，
      #    只把 tag 内容打印一遍。拿它当闸门等于没闸。所以判定分三层，缺一不可：
      #    ① 必须是 annotated tag（lightweight tag 在结构上就没有放签名的地方）
      #    ② tag 对象里真的有 SSHSIG 块
      #    ③ 用仓库内的 allowed_signers 验，输出里有 `Good "git" signature`
      #
      # 公钥放在 .github/signing-keys/allowed_signers 而不是塞进 secrets：它不是秘密，
      # 放在仓库里任何人都能自己复现这条校验，README 里也直接指向它。
      #
      # 补归档历史版本（workflow_dispatch）不设闸：那些 tag 打在闸门存在之前，用新版规则
      # 追溯旧账只会把「补存档」这条应急通道也堵死。未签时打 warning，让人知道情况。
      - name: 校验 tag 签名
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.t.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          AS=.github/signing-keys/allowed_signers
          [ -f "$AS" ] || { echo "::error::仓库里缺 $AS"; exit 1; }
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$AS"

          # ⚠️ 2026-11-11 发 0.4.50 时踩到：跑完 actions/checkout，本地 refs/tags/<tag> 解析
          #    出来的**不是 tag 对象**，于是下面第 ① 层判据必然假红（远端 API 查过
          #    git/ref/tags/v0.4.50 的 object.type 是 tag，SSHSIG 块也在，tag -v 本机也验得过）。
          #    显式重取一次 tag ref。refspec 用完整路径 refs/tags/<tag>，绕开任何短名解析。
          #    persist-credentials 是 false（本 job 只读仓库），所以凭据从 GITHUB_TOKEN 现拼。
          git fetch --force --no-tags \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "+refs/tags/${TAG}:refs/tags/${TAG}" >/dev/null 2>&1 || true

          fail_or_warn() {
            if [ "$EVENT" = "push" ]; then echo "::error::$1"; exit 1; fi
            echo "::warning::$1（补归档通道，不阻断）"
          }

          # 判据统一用完整 ref 路径：短名 `v1.2.3` 在「恰好存在同名文件/分支」时有歧义，
          # 而排障时最怕的就是「看起来像个 git 问题」。失败时把实际类型打出来。
          objtype=$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || echo none)
          if [ "$objtype" != "tag" ]; then
            fail_or_warn "$TAG 不是 annotated tag（本地 refs/tags/$TAG 的类型=$objtype）。lightweight tag 结构上没有签名位，用 git tag -s 重打。"
            exit 0
          fi

          if ! git cat-file tag "refs/tags/$TAG" | grep -q '^-----BEGIN SSH SIGNATURE-----$'; then
            fail_or_warn "$TAG 没有 SSH 签名。补签：git tag -d $TAG && git tag -s $TAG <commit> -F <说明文件>"
            exit 0
          fi

          out=$(git tag -v "$TAG" 2>&1) || true
          if ! printf '%s' "$out" | grep -q 'Good "git" signature'; then
            fail_or_warn "$TAG 签名验不过（公钥不匹配或被篡改）：$(printf '%s' "$out" | head -5 | tr '\n' ' ')"
            exit 0
          fi

          printf '%s\n' "$out" | head -1
          echo "✓ $TAG 的 SSH 签名有效"

      # 刻意**不重新构建**：CDN 上那份产物就是用户手上那一份，从那里回拉才能保证存档与
      # 线上字节一致。重新构建会因为依赖树、时间戳、签名随机数而产出不同字节——那就不是
      # "存档"，而是"另一份构建产物"，连签名清单都对不上。
      #
      # 以版本目录里的 SHA256SUMS.txt 为准，而不是去猜产物命名规则、也不依赖 stable.json
      # （后者只反映「当前最新」，补归档历史版本时会指错版本）。
      # 这份清单由已签名的 manifest 生成，是「这个版本目录里有什么」的权威声明。
      - name: 从 CDN 回拉该版本的产物
        shell: bash
        env:
          DIST_BASE: https://dl.xiaobenben.net
          VERSION: ${{ steps.t.outputs.version }}
        run: |
          set -euo pipefail
          base="${DIST_BASE}/releases/v${VERSION}"
          mkdir -p dl && cd dl
          # ⚠️ 2026-11-11 实测：这一条原来没有重试，runner 在境外、CDN 在国内，
          #    第一次请求就撞了 curl 28（60 秒连接超时），直接把整条归档判成「tag 号错了」。
          #    而同一个 URL 本机亚秒返回 200、Content-Length 778 —— 产物一直是好的。
          #    下面的文件下载早就加了 --retry-all-errors，唯独这个 778 字节的小清单漏了。
          if ! curl -fsS --max-time 60 --retry 4 --retry-delay 3 --retry-all-errors \
               "${base}/SHA256SUMS.txt" -o SHA256SUMS.txt; then
            echo "::error::CDN 上取不到 ${base}/SHA256SUMS.txt"
            echo "::error::两种可能，先分清再动手："
            echo "::error::  ① tag 名与实际发布版本不一致（tag=v${VERSION}，但线上没有这个号）"
            echo "::error::  ② 这个版本早于 0.4.47 —— 版本目录自带校验清单是从 0.4.47 起才有的，更早的版本无法归档"
            echo "::error::版本号来自 package.json 的 version。对照一下：tag 是 v${VERSION}，"
            echo "::error::就去 CDN 的 releases/v${VERSION}/ 看有没有产物；没有就是 tag 打错了号。"
            exit 1
          fi
          # 清单前几行是 # 注释，剔掉后每行是 `<sha256>  <文件名>` —— 正好是 sha256sum -c 的输入格式
          grep -v '^#' SHA256SUMS.txt > checks.txt
          # --retry-all-errors：CDN 在国内，runner 在境外，单个 90MB 文件的连接被中途掐断
          # 是常态而不是异常。2026-11-08 首发归档连撞两次（curl 28 连接超时，两次卡在不同
          # 文件），而产物本身完全正常——本地下载同一批文件 31 秒、sha256 全过。
          # 默认 curl 对「连接失败」不重试，于是这种纯网络抖动会把整条归档判成失败。
          while read -r _sha f; do
            [ -z "$f" ] && continue
            echo "  ↓ $f"
            curl -fsS --max-time 600 --retry 5 --retry-delay 5 --retry-all-errors \
              "${base}/${f}" -O
          done < checks.txt
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES.md; do
            if ! curl -fsSL --max-time 60 "${base}/${f}" -o "$f"; then
              rm -f "$f"
              echo "::warning::CDN 上缺 ${f}——不影响归档，但 AGPL 要求的许可副本会不全"
            fi
          done
          ls -lh

      # 完整性闸：清单里登记的 sha256 必须与下载到的字节逐条对上。
      # 这一步同时挡住「CDN 内容被改写」和「大文件下载被截断」——单文件 90MB 级别，
      # 截断不会报错，只会静默产出一个坏包，而那个坏包会被当成"官方存档"发出去。
      - name: 校验下载字节与清单登记的 sha256
        working-directory: dl
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c checks.txt
          rm -f checks.txt
          echo "✓ 全部产物与清单逐条一致"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          name: ${{ steps.t.outputs.tag }}
          # ⚠️ 2026-11-11 发现：这里原来只写 `files: dl/*`（从 CDN 回拉的产物），而下面
          #    body 里明明白白写着「许可全文见本 Release 附带的 LICENSE」——承诺了却没带。
          #    AGPL-3.0 第 4 条要求分发时附带许可副本，Release 附件是真实分发通道之一，
          #    所以这不是文案瑕疵。许可文件在仓库里就有，直接挂上，不必依赖 CDN 上也存一份。
          files: |
            dl/*
            LICENSE
            LICENSE-Commercial.md
            NOTICE
          generate_release_notes: true
          body: |
            下载请走 CDN：https://dl.xiaobenben.net/releases/v${{ steps.t.outputs.version }}/

            本 Release 仅作存档/灾备。国内直连 GitHub 下载慢，不作为分发通道。

            ---

            **许可**：本版本以 GNU Affero 通用公共许可协议第 3 版（AGPL-3.0-only）发布，
            许可全文见本 Release 附带的 `LICENSE`，商标与第三方依赖声明见 `NOTICE`。

            **对应源码（Corresponding Source）**：
            https://github.com/sji-xiaobenben/xiaobenben/tree/${{ steps.t.outputs.tag }}

            如需闭源分发、闭源对外服务或 OEM 预装，请另行取得商业许可（见 `LICENSE-Commercial.md`）。
