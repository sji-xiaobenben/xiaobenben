name: 功能建议
description: 提出新功能或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前值得先想一个问题：**这是「记忆层」该管的事，还是上层应用的职责？**
        小本本刻意只做存储与召回，不做任务编排、不做知识图谱分类，这类需求通常会以「不在范围内」被关掉。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景，而不是直接给方案。先说清痛点，方案可能比你想的更好。
      placeholder: |
        我在三个项目之间切换，AI 经常把 A 项目的约定套到 B 项目上。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 包括「不实现这个功能，现在怎么绕过」
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue 与讨论，确认不是重复建议
          required: true
